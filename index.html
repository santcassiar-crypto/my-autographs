


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VaultOS SR19 Intelligence Layer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:#fff;
display:flex;
min-height:100vh;
}

aside{
width:280px;
background:#01040d;
padding:15px;
border-right:1px solid #334155;
}

main{flex:1;padding:15px}

.card{
background:#0f172a;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

input,select,button{
width:100%;
padding:8px;
margin-top:6px;
background:#1e293b;
color:#fff;
border:1px solid #334155;
border-radius:6px;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
border-bottom:1px solid #334155;
padding:8px;
}

.stat{
display:inline-block;
padding:10px;
margin:5px;
background:#1e293b;
border-radius:8px;
min-width:120px;
text-align:center;
}

.stat b{
display:block;
font-size:18px;
color:#38bdf8;
}
</style>
</head>

<body>

<aside>

<h3>VaultOS SR19</h3>

<div class="card">
<h4>Add Record</h4>

<input id="name" placeholder="Name">

<select id="status">
<option>PENDING</option>
<option>SENT</option>
<option>SUCCESS</option>
<option>RTS</option>
</select>

<select id="route">
<option>Club Route</option>
<option>Agency Route</option>
<option>Event Route</option>
<option>Foundation Route</option>
<option>General Route</option>
</select>

<select id="addressMode">
<option value="AUTO">AUTO ADDRESS</option>
<option value="MANUAL">MANUAL ADDRESS</option>
</select>

<input id="address" placeholder="Manual Address">

<button onclick="addRecord()">Add Record</button>
</div>

<button onclick="exportData()">Export</button>

</aside>

<main>

<div class="card">
<h3>Dashboard</h3>
<div id="stats"></div>
</div>

<div class="card">
<h3>Database</h3>

<input id="search" placeholder="Search..." oninput="render()">

<table>
<thead>
<tr>
<th>Name</th>
<th>Status</th>
<th>Route</th>
<th>Address</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

</div>

</main>

<script>

/* =========================
   SR19 DATABASE CORE
========================= */

let vault = JSON.parse(localStorage.getItem("VAULT_SR19")) || {
version:"SR19",
targets:[],
memory:{}
};

const $ = id => document.getElementById(id);

function save(){
localStorage.setItem("VAULT_SR19", JSON.stringify(vault));
}

/* =========================
   CLEAN + NORMALISE
========================= */

function clean(v){
return (v ?? "").toString().replace(/\u00A0/g," ").trim();
}

/* =========================
   ROUTE ENGINE
========================= */

function getAddress(route){
switch(route){
case "Club Route": return "Training Ground / Stadium HQ";
case "Agency Route": return "Talent Agency / Production Office";
case "Event Route": return "Event Venue / HQ";
case "Foundation Route": return "Charity / Foundation HQ";
default: return "General Organisation";
}
}

/* =========================
   MEMORY ENGINE (SELF-LEARNING)
========================= */

function getMemory(name){
return vault.memory[name.toLowerCase()] || null;
}

function setMemory(name, data){
vault.memory[name.toLowerCase()] = data;
}

/* =========================
   SMART AUTOFILL
========================= */

function getSmart(name){

let mem = getMemory(name);

if(mem){
return mem;
}

return {
route:"General Route",
address:"General Organisation",
method:"TTM"
};
}

/* =========================
   ADD RECORD (INTELLIGENT)
========================= */

function addRecord(){

if(!name.value.trim()) return;

let smart = getSmart(name.value);

let routeValue = route.value || smart.route;

let finalAddress =
addressMode.value === "MANUAL"
? address.value
: smart.address || getAddress(routeValue);

let record = {
id: Date.now(),
name: clean(name.value),
status: status.value,
route: routeValue,
address: finalAddress,
history:[
{date:Date.now(),status:status.value}
]
};

/* LEARNING STEP */
setMemory(name.value, {
route: routeValue,
address: finalAddress,
method: status.value
});

vault.targets.push(record);

name.value="";
address.value="";

save();
render();
update();
analytics();
}

/* =========================
   DASHBOARD
========================= */

function update(){

let total = vault.targets.length;
let success=0, pending=0, sent=0, rts=0;

vault.targets.forEach(t=>{

if(t.status==="SUCCESS") success++;
else if(t.status==="PENDING") pending++;
else if(t.status==="SENT") sent++;
else if(t.status==="RTS") rts++;

});

stats.innerHTML = `
<div class="stat">Total<b>${total}</b></div>
<div class="stat">Success<b>${success}</b></div>
<div class="stat">Pending<b>${pending}</b></div>
<div class="stat">Sent<b>${sent}</b></div>
<div class="stat">RTS<b>${rts}</b></div>
<div class="stat">Rate<b>${total?((success/total)*100).toFixed(1):0}%</b></div>
`;

}

/* =========================
   ANALYTICS LAYER
========================= */

function analytics(){

let routeStats={};
let methodStats={};

vault.targets.forEach(t=>{

if(!routeStats[t.route]) routeStats[t.route]={t:0,s:0};
if(!methodStats[t.status]) methodStats[t.status]={t:0,s:0};

routeStats[t.route].t++;
methodStats[t.status].t++;

if(t.status==="SUCCESS"){
routeStats[t.route].s++;
methodStats[t.status].s++;
}

});

let bestRoute = Object.entries(routeStats)
.sort((a,b)=>(b[1].s/b[1].t)-(a[1].s/a[1].t))[0];

let container = document.getElementById("stats");

container.innerHTML += `
<hr>
<h4>🧠 Intelligence</h4>
<p>Best Route: <b>${bestRoute?.[0] || "N/A"}</b></p>
<p>Memory Entries: <b>${Object.keys(vault.memory).length}</b></p>
`;
}

/* =========================
   RENDER TABLE
========================= */

function render(){

let q = (search.value || "").toLowerCase();

list.innerHTML = vault.targets
.filter(t => JSON.stringify(t).toLowerCase().includes(q))
.map((t,i)=>`

<tr>
<td>${t.name}</td>
<td>${t.status}</td>
<td>${t.route}</td>
<td>${t.address}</td>
<td>
<button onclick="vault.targets.splice(${i},1); save(); render(); update();">
X
</button>
</td>
</tr>

`).join("");

}

/* =========================
   EXPORT
========================= */

function exportData(){

let blob = new Blob(
[JSON.stringify(vault,null,2)],
{type:"application/json"}
);

let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "VaultOS_SR19.json";
a.click();

}

/* =========================
   INIT
========================= */

render();
update();
analytics();

</script>

</body>
</html>
