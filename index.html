






<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VaultOS SR18.1</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:#fff;
display:flex;
min-height:100vh;
}

aside{
width:260px;
background:#01040d;
padding:15px;
border-right:1px solid #334155;
}

main{flex:1;padding:15px}

.card{
background:#0f172a;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

input,select,button{
width:100%;
padding:8px;
margin-top:6px;
background:#1e293b;
color:#fff;
border:1px solid #334155;
border-radius:6px;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
border-bottom:1px solid #334155;
padding:8px;
}
</style>
</head>

<body>

<aside>

<h3>VaultOS SR18.1</h3>

<div class="card">
<h3>Add Record</h3>

<input id="name" placeholder="Name">

<select id="status">
<option>PENDING</option>
<option>SENT</option>
<option>SUCCESS</option>
<option>RTS</option>
</select>

<select id="route">
<option value="Club Route">Club Route</option>
<option value="Agency Route">Agency Route</option>
<option value="Event Route">Event Route</option>
<option value="Foundation Route">Foundation Route</option>
<option value="General Route">General Route</option>
</select>

<select id="addressMode">
<option value="AUTO">AUTO ADDRESS</option>
<option value="MANUAL">MANUAL ADDRESS</option>
</select>

<input id="address" placeholder="Manual Address (if needed)">

<button onclick="addRecord()">Add Record</button>
</div>

<button onclick="exportData()">Export</button>
<input type="file" id="importFile">

</aside>

<main>

<div class="card">
<h3>Dashboard</h3>
<div id="stats"></div>
</div>

<div class="card">
<h3>Database</h3>

<table>
<thead>
<tr>
<th>Name</th>
<th>Status</th>
<th>Route</th>
<th>Address</th>
<th>Delete</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

</div>

</main>

<script>

/* =========================
   DATABASE
========================= */

let vault = JSON.parse(localStorage.getItem("VAULT_SR18")) || {
targets:[]
};

const $ = id => document.getElementById(id);

function save(){
localStorage.setItem("VAULT_SR18", JSON.stringify(vault));
}

/* =========================
   ADDRESS ENGINE
========================= */

function getAddress(route){
switch(route){
case "Club Route": return "Training Ground / Stadium HQ";
case "Agency Route": return "Talent Agency / Production Office";
case "Event Route": return "Event Venue / HQ";
case "Foundation Route": return "Charity / Foundation HQ";
default: return "General Organisation";
}
}

/* =========================
   ADD RECORD (FIXED)
========================= */

function addRecord(){

if(!name.value.trim()) return;

let routeValue = route.value;
let mode = addressMode.value;

let finalAddress =
mode === "MANUAL"
? address.value
: getAddress(routeValue);

vault.targets.push({
id: Date.now(),
name: name.value.trim(),
status: status.value,
route: routeValue,
address: finalAddress
});

name.value = "";
address.value = "";

save();
render();
update();
}

/* =========================
   IMPORT FIXED
========================= */

importFile.onchange = e => {

let file = e.target.files[0];
let r = new FileReader();

r.onload = () => {

let d = JSON.parse(r.result || "{}");
let raw = d.records || [];

vault.targets = raw.map((t,i)=>({

id: Date.now()+i,
name: t.Name || t.name || "Unknown",
status: (t.Status || t.status || "PENDING").toUpperCase(),
route: "General Route",
address: getAddress("General Route")

}));

save();
render();
update();

};

r.readAsText(file);
};

/* =========================
   DASHBOARD
========================= */

function update(){

let total = vault.targets.length;
let success = 0;
let pending = 0;
let sent = 0;
let rts = 0;

vault.targets.forEach(t=>{

let s = t.status;

if(s==="SUCCESS") success++;
else if(s==="PENDING") pending++;
else if(s==="SENT") sent++;
else if(s==="RTS") rts++;

});

stats.innerHTML = `
<p>Total: <b>${total}</b></p>
<p>Success: <b>${success}</b></p>
<p>Pending: <b>${pending}</b></p>
<p>Sent: <b>${sent}</b></p>
<p>RTS: <b>${rts}</b></p>
<p>Rate: <b>${total?((success/total)*100).toFixed(1):0}%</b></p>
`;

}

/* =========================
   RENDER TABLE
========================= */

function render(){

list.innerHTML = vault.targets.map((t,i)=>`

<tr>
<td>${t.name}</td>

<td>
<select onchange="vault.targets[${i}].status=this.value; save(); update();">
<option ${t.status==="PENDING"?"selected":""}>PENDING</option>
<option ${t.status==="SENT"?"selected":""}>SENT</option>
<option ${t.status==="SUCCESS"?"selected":""}>SUCCESS</option>
<option ${t.status==="RTS"?"selected":""}>RTS</option>
</select>
</td>

<td>${t.route}</td>
<td>${t.address}</td>

<td>
<button onclick="vault.targets.splice(${i},1); save(); render(); update();">
X
</button>
</td>

</tr>

`).join("");

}

/* =========================
   EXPORT
========================= */

function exportData(){

let blob = new Blob(
[JSON.stringify(vault,null,2)],
{type:"application/json"}
);

let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "VaultOS_SR18.json";
a.click();

}

/* =========================
   INIT
========================= */

render();
update();

</script>

</body>
</html>
