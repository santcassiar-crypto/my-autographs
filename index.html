<body>

<aside>
<h2>VaultOS SR16</h2>

<button onclick="show('dash')">Dashboard</button>
<button onclick="show('data')">Targets</button>

<button onclick="exportJSON()">Export</button>
<input type="file" id="importFile">
</aside>

<main>

<!-- DASHBOARD -->
<div id="dash">

<div class="card">
<h3>Overview</h3>

<div class="grid">
<div class="stat">Total<b id="total">0</b></div>
<div class="stat">Success<b id="success">0</b></div>
<div class="stat">Pending<b id="pending">0</b></div>
</div>

<div class="grid" style="margin-top:10px">
<div class="stat">Sent<b id="sent">0</b></div>
<div class="stat">RTS<b id="rts">0</b></div>
<div class="stat">Success %<b id="rate">0%</b></div>
</div>

</div>

</div>

<!-- DATA -->
<div id="data" class="hidden">

<div class="card">
<h3>Loading database...</h3>
</div>

</div>

</main>
<script>

let vault = JSON.parse(localStorage.getItem("VAULT_SR16")) || {
targets:[]
};

/* =========================
   NAVIGATION
========================= */
function show(id){
document.getElementById("dash").classList.add("hidden");
document.getElementById("data").classList.add("hidden");
document.getElementById(id).classList.remove("hidden");
}

/* =========================
   SAVE
========================= */
function save(){
localStorage.setItem("VAULT_SR16", JSON.stringify(vault));
}

/* =========================
   DASHBOARD ENGINE (CORE)
========================= */
function updateDashboard(){

let total = vault.targets.length;

/* status groups */
let successList = vault.targets.filter(x =>
(x.status||"").toUpperCase()==="SUCCESS"
);

let pendingList = vault.targets.filter(x =>
(x.status||"").toUpperCase()==="PENDING"
);

let sentList = vault.targets.filter(x =>
(x.status||"").toUpperCase()==="SENT"
);

let rtsList = vault.targets.filter(x =>
(x.status||"").toUpperCase().includes("RTS")
);

/* basic stats */
let success = successList.length;
let pending = pendingList.length;
let sent = sentList.length;
let rts = rtsList.length;

let rate = total ? ((success/total)*100).toFixed(1) : 0;

/* =========================
   ROUTE ANALYTICS
========================= */
let routeStats = {};

vault.targets.forEach(t=>{
let r = (t.route || "General").trim();

if(!routeStats[r]){
routeStats[r] = {total:0,success:0};
}

routeStats[r].total++;

if((t.status||"").toUpperCase()==="SUCCESS"){
routeStats[r].success++;
}
});

/* =========================
   METHOD ANALYTICS
========================= */
let methodStats = {};

vault.targets.forEach(t=>{
let m = (t.method || "UNKNOWN").trim();

if(!methodStats[m]){
methodStats[m] = {total:0,success:0};
}

methodStats[m].total++;

if((t.status||"").toUpperCase()==="SUCCESS"){
methodStats[m].success++;
}
});

/* =========================
   BEST ROUTE / METHOD
========================= */
let bestRoute = Object.entries(routeStats)
.sort((a,b)=>
(b[1].success/b[1].total)-(a[1].success/a[1].total)
)[0];

let bestMethod = Object.entries(methodStats)
.sort((a,b)=>
(b[1].success/b[1].total)-(a[1].success/a[1].total)
)[0];

/* =========================
   RENDER DASHBOARD
========================= */
document.getElementById("total").textContent = total;
document.getElementById("success").textContent = success;
document.getElementById("pending").textContent = pending;
document.getElementById("sent").textContent = sent;
document.getElementById("rts").textContent = rts;
document.getElementById("rate").textContent = rate + "%";

/* render analytics panel */
renderAnalytics(routeStats, methodStats, bestRoute, bestMethod);

}

/* =========================
   ANALYTICS UI
========================= */
function renderAnalytics(routeStats, methodStats, bestRoute, bestMethod){

let container = document.getElementById("analytics");

if(!container){
container = document.createElement("div");
container.id = "analytics";
document.getElementById("dash").appendChild(container);
}

let routeHTML = "<div class='card'><h3>Route Performance</h3>";

for(let r in routeStats){

let s = routeStats[r].success;
let t = routeStats[r].total;
let pct = t ? ((s/t)*100).toFixed(1) : 0;

routeHTML += `
<p><b>${r}</b> — ${pct}% (${s}/${t})</p>
<div style="height:6px;background:#1e293b;border-radius:4px;margin-bottom:8px">
<div style="width:${pct}%;height:6px;background:#38bdf8"></div>
</div>
`;
}

routeHTML += "</div>";

let methodHTML = "<div class='card'><h3>Method Performance</h3>";

for(let m in methodStats){

let s = methodStats[m].success;
let t = methodStats[m].total;
let pct = t ? ((s/t)*100).toFixed(1) : 0;

methodHTML += `
<p><b>${m}</b> — ${pct}% (${s}/${t})</p>
`;
}

methodHTML += "</div>";

let insightHTML = `
<div class="card">
<h3>Insights</h3>

<p><b>Best Route:</b> ${bestRoute ? bestRoute[0] : "N/A"}</p>
<p><b>Best Method:</b> ${bestMethod ? bestMethod[0] : "N/A"}</p>
<p><b>Success Rate:</b> ${rateText(vault.targets)}</p>
</div>
`;

container.innerHTML =
routeHTML + methodHTML + insightHTML;

}

/* =========================
   HELPER
========================= */
function rateText(list){

let total = list.length;

let success = list.filter(x =>
(x.status||"").toUpperCase()==="SUCCESS"
).length;

return total ? ((success/total)*100).toFixed(1) + "%" : "0%";
}

/* =========================
   INIT
========================= */
updateDashboard();

</script>
<script>

/* =========================
   ADD TARGET
========================= */
function addTarget(){

let nameEl = document.getElementById("name");
let statusEl = document.getElementById("status");
let routeEl = document.getElementById("route");
let methodEl = document.getElementById("method");
let addressEl = document.getElementById("address");

vault.targets.push({
id: Date.now(),
name: nameEl.value || "Unknown",
status: statusEl.value || "PENDING",
route: routeEl.value || "General",
method: methodEl.value || "TTM",
address: addressEl.value || suggestAddress(routeEl.value)
});

nameEl.value = "";
addressEl.value = "";

refresh();
renderTable();
}

/* =========================
   DELETE TARGET
========================= */
function deleteTarget(i){
vault.targets.splice(i,1);
refresh();
renderTable();
}

/* =========================
   REFRESH ENGINE
========================= */
function refresh(){
save();
updateDashboard();
renderTable();
}

/* =========================
   ADDRESS SUGGESTION ENGINE
========================= */
function suggestAddress(route){

switch(route){

case "Club Route":
return "Training Ground / Stadium HQ";

case "Agency Route":
return "Talent Agency / Production Office";

case "Event Route":
return "Event Venue / Organiser HQ";

case "Foundation Route":
return "Charity / Foundation HQ";

default:
return "General Organisation Route";
}

}

</script>
