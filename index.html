






<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VaultOS SR16 FIXED</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:#fff;
display:flex;
min-height:100vh;
}

aside{
width:240px;
background:#01040d;
padding:15px;
border-right:1px solid #334155;
}

main{
flex:1;
padding:15px;
}

.card{
background:#0f172a;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

button, input, select{
width:100%;
padding:8px;
margin-top:8px;
background:#1e293b;
color:#fff;
border:1px solid #334155;
border-radius:6px;
}

.hidden{display:none}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.stat{
background:#1e293b;
padding:10px;
border-radius:8px;
text-align:center;
}

.stat b{
display:block;
font-size:20px;
margin-top:5px;
color:#38bdf8;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
border-bottom:1px solid #334155;
padding:6px;
}
</style>
</head>

<body>

<aside>
<h2>VaultOS SR16</h2>

<button onclick="show('dash')">Dashboard</button>
<button onclick="show('data')">Targets</button>

<button onclick="exportJSON()">Export</button>
<input type="file" id="importFile">
</aside>

<main>

<!-- DASH -->
<div id="dash">

<div class="card">
<h3>Overview</h3>

<div class="grid">
<div class="stat">Total<b id="total">0</b></div>
<div class="stat">Success<b id="success">0</b></div>
<div class="stat">Pending<b id="pending">0</b></div>
</div>

<div class="grid" style="margin-top:10px">
<div class="stat">Sent<b id="sent">0</b></div>
<div class="stat">RTS<b id="rts">0</b></div>
<div class="stat">Rate<b id="rate">0%</b></div>
</div>

</div>

</div>

<!-- DATA -->
<div id="data" class="hidden">

<div class="card">

<h3>Add Target</h3>

<input id="name" placeholder="Name">

<select id="status">
<option>PENDING</option>
<option>SENT</option>
<option>SUCCESS</option>
<option>RTS</option>
</select>

<select id="route">
<option>Club Route</option>
<option>Agency Route</option>
<option>Event Route</option>
<option>Foundation Route</option>
<option>General</option>
</select>

<select id="method">
<option>TTM</option>
<option>IP</option>
<option>EVENT</option>
</select>

<input id="address" placeholder="Address (auto fills)">
<button onclick="addTarget()">Add</button>

<input id="search" placeholder="Search..." oninput="renderTable()">

</div>

<div class="card">
<table>
<thead>
<tr>
<th>Name</th>
<th>Status</th>
<th>Route</th>
<th>Method</th>
<th>Address</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>

</main>

<script>

let vault = JSON.parse(localStorage.getItem("VAULT_SR16")) || {targets:[]};

/* NAV */
function show(id){
dash.classList.add("hidden");
data.classList.add("hidden");
document.getElementById(id).classList.remove("hidden");
}

/* SAVE */
function save(){
localStorage.setItem("VAULT_SR16", JSON.stringify(vault));
}

/* AUTO ADDRESS */
function suggestAddress(route){
switch(route){
case "Club Route": return "Training Ground / Stadium HQ";
case "Agency Route": return "Talent Agency HQ";
case "Event Route": return "Event Venue HQ";
case "Foundation Route": return "Charity HQ";
default: return "General Organisation";
}
}

/* ADD */
function addTarget(){

vault.targets.push({
id:Date.now(),
name:name.value,
status:status.value,
route:route.value,
method:method.value,
address:address.value || suggestAddress(route.value)
});

name.value="";
address.value="";

save();
update();
renderTable();
}

/* DELETE */
function del(i){
vault.targets.splice(i,1);
save();
update();
renderTable();
}

/* DASH */
function update(){

let t=vault.targets.length;
let s=vault.targets.filter(x=>x.status==="SUCCESS").length;
let p=vault.targets.filter(x=>x.status==="PENDING").length;
let sent=vault.targets.filter(x=>x.status==="SENT").length;
let rts=vault.targets.filter(x=>x.status==="RTS").length;

total.textContent=t;
success.textContent=s;
pending.textContent=p;
sentEl.textContent=sent;
rtsEl.textContent=rts;
rate.textContent=t?((s/t)*100).toFixed(1)+"%":"0%";

}

/* TABLE */
function renderTable(){

let q=(search.value||"").toLowerCase();

table.innerHTML=vault.targets
.filter(x=>JSON.stringify(x).toLowerCase().includes(q))
.map((t,i)=>`
<tr>
<td><input value="${t.name}" oninput="vault.targets[${i}].name=this.value; save(); update();"></td>

<td>${t.status}</td>
<td>${t.route}</td>
<td>${t.method}</td>
<td><input value="${t.address}" oninput="vault.targets[${i}].address=this.value; save();"></td>

<td><button onclick="del(${i})">X</button></td>
</tr>
`).join("");

}

/* EXPORT */
function exportJSON(){
let a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([JSON.stringify(vault)],{type:"application/json"}));
a.download="VaultOS_SR16.json";
a.click();
}

/* IMPORT */
importFile.onchange=e=>{
let r=new FileReader();
r.onload=()=>{
try{
let d=JSON.parse(r.result);
vault.targets=d.records||d.targets||[];
save();
update();
renderTable();
}catch(err){alert("Import failed");}
};
r.readAsText(e.target.files[0]);
};

/* INIT */
update();
renderTable();

</script>

</body>
</html>
