






<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VaultOS SR18 Database Engine</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:#fff;
display:flex;
min-height:100vh;
}

aside{
width:260px;
background:#01040d;
padding:15px;
border-right:1px solid #334155;
}

main{flex:1;padding:15px}

.card{
background:#0f172a;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

input,select,button{
width:100%;
padding:8px;
margin-top:6px;
background:#1e293b;
color:#fff;
border:1px solid #334155;
border-radius:6px;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
border-bottom:1px solid #334155;
padding:8px;
}

.stat{
display:inline-block;
padding:10px;
background:#1e293b;
border-radius:8px;
margin:5px;
min-width:120px;
text-align:center;
}

.stat b{
display:block;
font-size:18px;
color:#38bdf8;
}

.hidden{display:none}
</style>
</head>

<body>

<aside>
<h3>VaultOS SR18</h3>

<input type="file" id="importFile">
<button onclick="exportData()">Export</button>

<hr>

<input id="name" placeholder="Name">
<select id="status">
<option>PENDING</option>
<option>SENT</option>
<option>SUCCESS</option>
<option>RTS</option>
</select>

<select id="route">
<option>Club Route</option>
<option>Agency Route</option>
<option>Event Route</option>
<option>Foundation Route</option>
<option>General Route</option>
</select>

<button onclick="addRecord()">Add Record</button>
</aside>

<main>

<div class="card">
<h3>Dashboard</h3>

<div id="stats"></div>
</div>

<div class="card">
<h3>Database</h3>

<table>
<thead>
<tr>
<th>Name</th>
<th>Status</th>
<th>Route</th>
<th>Address</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

</div>

</main>

<script>

/* =========================
   DATABASE CORE
========================= */

let vault = JSON.parse(localStorage.getItem("VAULT_SR18")) || {
version:"SR18",
targets:[]
};

const $ = id => document.getElementById(id);

function save(){
localStorage.setItem("VAULT_SR18", JSON.stringify(vault));
}

/* =========================
   CLEAN + NORMALISE
========================= */

function clean(v){
return (v ?? "").toString().replace(/\u00A0/g," ").trim();
}

function normaliseStatus(s){
s = clean(s).toUpperCase();
if(s.includes("SUCCESS")) return "SUCCESS";
if(s.includes("RTS") || s.includes("FAIL")) return "RTS";
if(s.includes("SENT")) return "SENT";
return "PENDING";
}

/* =========================
   ADDRESS ENGINE
========================= */

function getAddress(route){
switch(route){
case "Club Route": return "Training Ground / Stadium HQ";
case "Agency Route": return "Talent Agency / Production Office";
case "Event Route": return "Event Venue / HQ";
case "Foundation Route": return "Charity / Foundation HQ";
default: return "General Organisation";
}
}

/* =========================
   ADD RECORD
========================= */

function addRecord(){

if(!name.value.trim()) return;

let record = {
id: Date.now(),
profile:{name: clean(name.value)},
current:{
status: status.value,
route: route.value,
address: getAddress(route.value)
},
history:[
{date:Date.now(),status:status.value}
]
};

vault.targets.push(record);

name.value="";

save();
render();
update();
}

/* =========================
   IMPORT ENGINE FIXED
========================= */

importFile.onchange = e => {

let file = e.target.files[0];
let r = new FileReader();

r.onload = () => {
try{

let d = JSON.parse(r.result || "{}");
let raw = d.records || [];

let seen = new Set();

vault.targets = raw.map((t,i)=>{

let name = clean(t.Name || t.name || "Unknown");
let key = name.toLowerCase();

if(seen.has(key)) return null;
seen.add(key);

return {
id: Date.now()+i,
profile:{name},
current:{
status: normaliseStatus(t.Status),
route:"General Route",
address:getAddress("General Route")
},
history:[
{date:Date.now(),status:normaliseStatus(t.Status)}
]
};

}).filter(Boolean);

save();
render();
update();

alert("Import complete: "+vault.targets.length);

}catch(err){
alert("Import failed: "+err.message);
}
};

r.readAsText(file);
};

/* =========================
   DASHBOARD
========================= */

function update(){

let total = vault.targets.length;
let success = 0;
let pending = 0;
let sent = 0;
let rts = 0;

vault.targets.forEach(t=>{

let s = t.current.status;

if(s==="SUCCESS") success++;
else if(s==="PENDING") pending++;
else if(s==="SENT") sent++;
else if(s==="RTS") rts++;

});

stats.innerHTML = `
<div class="stat">Total<b>${total}</b></div>
<div class="stat">Success<b>${success}</b></div>
<div class="stat">Pending<b>${pending}</b></div>
<div class="stat">Sent<b>${sent}</b></div>
<div class="stat">RTS<b>${rts}</b></div>
<div class="stat">Rate<b>${total?((success/total)*100).toFixed(1):0}%</b></div>
`;

}

/* =========================
   RENDER TABLE
========================= */

function render(){

list.innerHTML = vault.targets.map((t,i)=>`

<tr>
<td>${t.profile.name}</td>

<td>
<select onchange="vault.targets[${i}].current.status=this.value; save(); update();">
<option ${t.current.status==="PENDING"?"selected":""}>PENDING</option>
<option ${t.current.status==="SENT"?"selected":""}>SENT</option>
<option ${t.current.status==="SUCCESS"?"selected":""}>SUCCESS</option>
<option ${t.current.status==="RTS"?"selected":""}>RTS</option>
</select>
</td>

<td>${t.current.route}</td>

<td>${t.current.address}</td>

<td>
<button onclick="vault.targets.splice(${i},1); save(); render(); update();">
Delete
</button>
</td>

</tr>

`).join("");

}

/* =========================
   EXPORT
========================= */

function exportData(){

let blob = new Blob(
[JSON.stringify(vault,null,2)],
{type:"application/json"}
);

let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "VaultOS_SR18.json";
a.click();

}

/* =========================
   INIT
========================= */

render();
update();

</script>

</body>
</html>
