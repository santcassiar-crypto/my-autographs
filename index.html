


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VaultOS Core v1 Stable</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#020617;color:#fff;display:flex;min-height:100vh}
aside{width:260px;background:#01040d;padding:15px;border-right:1px solid #334155}
main{flex:1;padding:15px}

.card{background:#0f172a;padding:15px;border-radius:10px;margin-bottom:15px}

input,select,button{
width:100%;padding:8px;margin-top:8px;
background:#1e293b;color:#fff;border:1px solid #334155;border-radius:6px
}

table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #334155;padding:8px;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#1e293b;padding:10px;border-radius:8px;text-align:center}
.stat b{display:block;font-size:18px;color:#38bdf8;margin-top:5px}
small{color:#94a3b8}
</style>
</head>

<body>

<aside>
<h3>VaultOS Core v1</h3>

<button onclick="refresh()">Refresh</button>
<button onclick="exportData()">Export</button>

<input type="file" id="importFile">

<hr>

<h4>Add Target</h4>

<input id="name" placeholder="Name">

<select id="status">
<option>PENDING</option>
<option>SENT</option>
<option>SUCCESS</option>
<option>RTS</option>
</select>

<select id="route">
<option>Club Route</option>
<option>Agency Route</option>
<option>Event Route</option>
<option>Foundation Route</option>
<option>General</option>
</select>

<select id="method">
<option>TTM</option>
<option>IP</option>
<option>EVENT</option>
</select>

<select id="address">
<option>AUTO</option>
<option>TRAINING GROUND</option>
<option>AGENCY OFFICE</option>
<option>EVENT VENUE</option>
<option>HOME ADDRESS</option>
</select>

<button onclick="addTarget()">Add Record</button>
</aside>

<main>

<div class="card">
<h3>Dashboard</h3>

<div class="grid">
<div class="stat">Total<b id="t">0</b></div>
<div class="stat">Success<b id="s">0</b></div>
<div class="stat">Pending<b id="p">0</b></div>
</div>

<div class="grid" style="margin-top:10px">
<div class="stat">RTS<b id="r">0</b></div>
<div class="stat">Success %<b id="rate">0%</b></div>
<div class="stat">AI Score<b id="ai">0%</b></div>
</div>
</div>

<div class="card">
<h3>Targets</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>Status</th>
<th>Route</th>
<th>Method</th>
<th>Address</th>
<th>AI</th>
<th></th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

<div class="card">
<h3>Analytics</h3>
<div id="analytics"></div>
</div>

</main>

<script>

let vault = JSON.parse(localStorage.getItem("VAULT_CORE")) || {targets:[]};

/* ---------- SAVE ---------- */
function save(){
localStorage.setItem("VAULT_CORE", JSON.stringify(vault));
}

/* ---------- NORMALISE STATUS ---------- */
function cleanStatus(s){
s = (s||"PENDING").toUpperCase().trim();
if(s.includes("SUCCESS")) return "SUCCESS";
if(s.includes("RTS") || s.includes("FAIL")) return "RTS";
if(s.includes("SENT")) return "SENT";
return "PENDING";
}

/* ---------- AI SCORE ---------- */
function aiScore(t){
let score = 50;

if(t.status==="SUCCESS") score += 40;
if(t.status==="RTS") score -= 30;
if(t.route==="Club Route") score += 5;
if(t.method==="IP") score += 10;

return Math.max(0, Math.min(100, score));
}

/* ---------- ADD ---------- */
function addTarget(){

vault.targets.push({
id:Date.now(),
name:document.getElementById("name").value||"Unknown",
status:document.getElementById("status").value,
route:document.getElementById("route").value,
method:document.getElementById("method").value,
address:document.getElementById("address").value
});

save();
refresh();
}

/* ---------- DELETE ---------- */
function del(i){
vault.targets.splice(i,1);
save();
refresh();
}

/* ---------- IMPORT ---------- */
importFile.onchange = e=>{
let r = new FileReader();

r.onload = ()=>{

let d = JSON.parse(r.result||"{}");
let raw = d.records || d.targets || [];

vault.targets = raw.map(x=>({
id:Date.now()+Math.random(),
name:x.Name||x.name||"Unknown",
status:cleanStatus(x.Status||x.status),
route:x.route||"General Route",
method:x.method||"TTM",
address:x.address||"AUTO"
}));

save();
refresh();
};

r.readAsText(e.target.files[0]);
};

/* ---------- DASHBOARD ---------- */
function dashboard(){

let t = vault.targets.length;
let s = vault.targets.filter(x=>x.status==="SUCCESS").length;
let p = vault.targets.filter(x=>x.status==="PENDING").length;
let r = vault.targets.filter(x=>x.status==="RTS").length;

document.getElementById("t").textContent=t;
document.getElementById("s").textContent=s;
document.getElementById("p").textContent=p;
document.getElementById("r").textContent=r;
document.getElementById("rate").textContent = t?((s/t)*100).toFixed(1)+"%":"0%";

let avgAI = vault.targets.length ?
(vault.targets.reduce((a,b)=>a+aiScore(b),0)/t).toFixed(1) : 0;

document.getElementById("ai").textContent = avgAI+"%";
}

/* ---------- TABLE ---------- */
function render(){

let html = "";

vault.targets.forEach((t,i)=>{

let ai = aiScore(t);

html += `
<tr>
<td><input value="${t.name}"
oninput="vault.targets[${i}].name=this.value;save()"></td>

<td>
<select onchange="vault.targets[${i}].status=this.value;save();refresh()">
<option ${t.status==="PENDING"?"selected":""}>PENDING</option>
<option ${t.status==="SENT"?"selected":""}>SENT</option>
<option ${t.status==="SUCCESS"?"selected":""}>SUCCESS</option>
<option ${t.status==="RTS"?"selected":""}>RTS</option>
</select>
</td>

<td>
<select onchange="vault.targets[${i}].route=this.value;save()">
<option>Club Route</option>
<option>Agency Route</option>
<option>Event Route</option>
<option>Foundation Route</option>
<option>General</option>
</select>
</td>

<td>
<select onchange="vault.targets[${i}].method=this.value;save()">
<option>TTM</option>
<option>IP</option>
<option>EVENT</option>
</select>
</td>

<td>${t.address}</td>

<td>${ai}%</td>

<td><button onclick="del(${i})">X</button></td>
</tr>
`;
});

document.getElementById("list").innerHTML = html;
}

/* ---------- ANALYTICS ---------- */
function analytics(){

let routes = {};
let methods = {};

vault.targets.forEach(t=>{
routes[t.route]=(routes[t.route]||0)+1;
methods[t.method]=(methods[t.method]||0)+1;
});

document.getElementById("analytics").innerHTML = `
<pre>Routes: ${JSON.stringify(routes,null,2)}</pre>
<pre>Methods: ${JSON.stringify(methods,null,2)}</pre>
`;
}

/* ---------- MASTER REFRESH ---------- */
function refresh(){
save();
render();
dashboard();
analytics();
}

/* ---------- EXPORT ---------- */
function exportData(){
let blob = new Blob([JSON.stringify(vault,null,2)],{type:"application/json"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download="vault_core.json";
a.click();
}

/* INIT */
refresh();

</script>

</body>
</html>
