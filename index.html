


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VaultOS Core v1 Stable</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
margin:0;
font-family:Arial;
background:#020617;
color:#fff;
display:flex;
min-height:100vh;
}

aside{
width:260px;
background:#01040d;
padding:15px;
border-right:1px solid #334155;
}

main{flex:1;padding:15px}

.card{
background:#0f172a;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

input,select,button{
width:100%;
padding:8px;
margin-top:6px;
background:#1e293b;
color:#fff;
border:1px solid #334155;
border-radius:6px;
}

table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #334155;padding:6px;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.stat{
background:#1e293b;
padding:10px;
border-radius:8px;
text-align:center;
}

.stat b{display:block;font-size:18px;color:#38bdf8;margin-top:5px}

</style>
</head>

<body>

<aside>
<h3>VaultOS Core v1</h3>

<button onclick="addRandom()">+ Add Record</button>
<button onclick="exportData()">Export</button>

<input type="file" id="importFile">

</aside>

<main>

<div class="card">
<h3>Dashboard</h3>

<div class="grid">
<div class="stat">Total<b id="total">0</b></div>
<div class="stat">Success<b id="success">0</b></div>
<div class="stat">Pending<b id="pending">0</b></div>
</div>

<div class="grid" style="margin-top:10px">
<div class="stat">RTS<b id="rts">0</b></div>
<div class="stat">Sent<b id="sent">0</b></div>
<div class="stat">Success %<b id="rate">0%</b></div>
</div>

</div>

<div class="card">
<h3>Targets</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>Status</th>
<th>Route</th>
<th>Method</th>
<th>Address</th>
<th></th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

</main>

<script>

/* =========================
   INDEXEDDB CORE
========================= */
let db;
let DB_NAME = "VAULT_CORE_V1";

function initDB(){
let req = indexedDB.open(DB_NAME,1);

req.onupgradeneeded = e=>{
db = e.target.result;
db.createObjectStore("targets",{keyPath:"id"});
};

req.onsuccess = e=>{
db = e.target.result;
loadAll();
};
}

function tx(store,mode="readwrite"){
return db.transaction(store,mode).objectStore(store);
}

/* =========================
   NORMALISER ENGINE
========================= */
function cleanStatus(s){
if(!s) return "PENDING";
s = String(s).toUpperCase();
if(s.includes("SUCCESS")) return "SUCCESS";
if(s.includes("RTS") || s.includes("FAIL")) return "RTS";
if(s.includes("SENT")) return "SENT";
return "PENDING";
}

/* =========================
   ADDRESS AI (SIMPLE INTELLIGENCE)
========================= */
const addressAI = {
"Club Route":["Training Ground HQ","Stadium Office"],
"Agency Route":["Talent Agency HQ","Management Office"],
"Event Route":["Event Venue Office","Organiser HQ"],
"Foundation Route":["Charity HQ","Foundation Office"],
"General":["Unknown Location"]
};

/* =========================
   STATE
========================= */
let cache = [];

/* =========================
   LOAD
========================= */
function loadAll(){
let req = tx("targets").getAll();
req.onsuccess = e=>{
cache = e.target.result || [];
render();
updateDashboard();
};
}

/* =========================
   SAVE
========================= */
function save(item){
tx("targets").put(item);
}

/* =========================
   DELETE
========================= */
function del(id){
tx("targets").delete(id);
setTimeout(loadAll,50);
}

/* =========================
   ADD
========================= */
function addRandom(){
let item = {
id: Date.now(),
name: "New Target " + Math.floor(Math.random()*1000),
status: "PENDING",
route: "Club Route",
method: "TTM",
address: ""
};
save(item);
setTimeout(loadAll,50);
}

/* =========================
   IMPORT FIXED PIPELINE
========================= */
document.getElementById("importFile").addEventListener("change",e=>{
let f = e.target.files[0];
let r = new FileReader();

r.onload=()=>{
let d = JSON.parse(r.result||"{}");
let raw = d.records || [];

raw.forEach((t,i)=>{

let item = {
id: Date.now()+i,
name: t.Name || t.name || "Unknown",
status: cleanStatus(t.Status || t.status),
route: "General",
method: "TTM",
address: ""
};

save(item);

});

setTimeout(loadAll,100);
};

r.readAsText(f);
});

/* =========================
   ANALYTICS ENGINE
========================= */
function updateDashboard(){

let total = cache.length;
let success = cache.filter(x=>x.status==="SUCCESS").length;
let pending = cache.filter(x=>x.status==="PENDING").length;
let rts = cache.filter(x=>x.status==="RTS").length;
let sent = cache.filter(x=>x.status==="SENT").length;

let rate = total ? ((success/total)*100).toFixed(1) : 0;

totalEl.textContent = total;
successEl.textContent = success;
pendingEl.textContent = pending;
rtsEl.textContent = rts;
sentEl.textContent = sent;
rateEl.textContent = rate + "%";

}

/* =========================
   RENDER TABLE
========================= */
function render(){

list.innerHTML = cache.map((t,i)=>{

let suggestions = addressAI[t.route] || ["Unknown"];

return `
<tr>

<td><input value="${t.name}"
oninput="updateField(${t.id},'name',this.value)"></td>

<td>
<select onchange="updateField(${t.id},'status',this.value)">
<option ${t.status==="PENDING"?"selected":""}>PENDING</option>
<option ${t.status==="SUCCESS"?"selected":""}>SUCCESS</option>
<option ${t.status==="RTS"?"selected":""}>RTS</option>
<option ${t.status==="SENT"?"selected":""}>SENT</option>
</select>
</td>

<td>
<select onchange="updateField(${t.id},'route',this.value)">
<option>Club Route</option>
<option>Agency Route</option>
<option>Event Route</option>
<option>Foundation Route</option>
<option>General</option>
</select>
</td>

<td>
<select onchange="updateField(${t.id},'method',this.value)">
<option>TTM</option>
<option>IP</option>
<option>EVENT</option>
</select>
</td>

<td>
<select onchange="updateField(${t.id},'address',this.value)">
${suggestions.map(a=>`<option ${t.address===a?"selected":""}>${a}</option>`).join("")}
</select>
</td>

<td><button onclick="del(${t.id})">X</button></td>

</tr>
`;

}).join("");

}

/* =========================
   UPDATE FIELD
========================= */
function updateField(id,key,value){

let item = cache.find(x=>x.id===id);
if(!item) return;

item[key] = value;

save(item);
setTimeout(loadAll,50);

}

/* =========================
   EXPORT
========================= */
function exportData(){

let blob = new Blob(
[JSON.stringify(cache,null,2)],
{type:"application/json"}
);

let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "VaultOS_Core_v1.json";
a.click();

}

/* =========================
   INIT
========================= */
initDB();

</script>

</body>
</html>
