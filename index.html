


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VaultOS Core AI v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
margin:0;font-family:Arial;background:#020617;color:#fff;display:flex;min-height:100vh;
}
aside{
width:260px;background:#01040d;padding:15px;border-right:1px solid #334155;
}
main{flex:1;padding:15px}

.card{background:#0f172a;padding:15px;border-radius:10px;margin-bottom:15px}

input,select,button{
width:100%;padding:8px;margin-top:6px;
background:#1e293b;color:#fff;
border:1px solid #334155;border-radius:6px;
}

table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #334155;padding:6px;font-size:12px}

.badge{
padding:3px 6px;border-radius:6px;font-size:11px;
background:#1e293b;display:inline-block
}

.high{color:#22c55e}
.mid{color:#facc15}
.low{color:#ef4444}
</style>
</head>

<body>

<aside>
<h3>VaultOS AI v2</h3>
<input type="file" id="importFile">
<button onclick="addRecord()">+ Add</button>
<button onclick="exportData()">Export</button>
</aside>

<main>

<div class="card">
<h3>AI Dashboard</h3>
<div id="dash"></div>
</div>

<div class="card">
<h3>Targets (AI Scored)</h3>
<table>
<thead>
<tr>
<th>Name</th>
<th>Status</th>
<th>Route</th>
<th>AI Score</th>
<th>Prediction</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>
</div>

</main>

<script>

/* =========================
   DB
========================= */
let db;
let cache=[];

function initDB(){
let req=indexedDB.open("VAULT_AI_V2",1);

req.onupgradeneeded=e=>{
db=e.target.result;
db.createObjectStore("targets",{keyPath:"id"});
};

req.onsuccess=e=>{
db=e.target.result;
load();
};
}

function store(){return db.transaction("targets","readwrite").objectStore("targets");}

/* =========================
   AI ENGINE (CORE LOGIC)
========================= */

/* convert everything into signals */
function aiScore(t){

let score = 50;

/* STATUS SIGNAL */
if(t.status==="SUCCESS") score += 30;
if(t.status==="RTS") score -= 35;
if(t.status==="PENDING") score += 5;

/* ROUTE SIGNAL */
switch(t.route){
case "Club Route": score += 10; break;
case "Agency Route": score += 8; break;
case "Event Route": score += 5; break;
case "Foundation Route": score += 12; break;
default: score += 0;
}

/* METHOD SIGNAL */
if(t.method==="IP") score += 10;
if(t.method==="TTM") score += 5;
if(t.method==="EVENT") score += 3;

/* clamp */
return Math.max(0,Math.min(100,score));
}

/* prediction labels */
function label(score){
if(score>=75) return "HIGH SUCCESS";
if(score>=50) return "MEDIUM";
return "LOW / RTS RISK";
}

/* color */
function color(score){
if(score>=75) return "high";
if(score>=50) return "mid";
return "low";
}

/* =========================
   LOAD
========================= */
function load(){
let req=store().getAll();
req.onsuccess=e=>{
cache=e.target.result||[];
render();
dash();
};
}

/* =========================
   SAVE
========================= */
function save(item){store().put(item);}

/* =========================
   UPDATE FIELD
========================= */
function update(id,key,val){

let t=cache.find(x=>x.id===id);
if(!t)return;

t[key]=val;

save(t);
render();
dash();
}

/* =========================
   ADD
========================= */
function addRecord(){
let t={
id:Date.now(),
name:"New Target",
status:"PENDING",
route:"Club Route",
method:"TTM"
};
save(t);
setTimeout(load,50);
}

/* =========================
   IMPORT (ROBUST)
========================= */
document.getElementById("importFile").addEventListener("change",e=>{
let f=e.target.files[0];
let r=new FileReader();

r.onload=()=>{
let d=JSON.parse(r.result||"{}");
let raw=d.records||[];

raw.forEach((x,i)=>{

let t={
id:Date.now()+i,
name:x.Name||x.name||"Unknown",
status:(x.Status||"PENDING").toUpperCase().includes("SUCCESS")?"SUCCESS":
(x.Status||"PENDING").toUpperCase().includes("RTS")?"RTS":"PENDING",
route:"General",
method:"TTM"
};

save(t);

});

setTimeout(load,100);
};

r.readAsText(f);
});

/* =========================
   DASHBOARD AI
========================= */
function dash(){

let total=cache.length;

let scores=cache.map(aiScore);

let avg=(scores.reduce((a,b)=>a+b,0)/Math.max(1,total)).toFixed(1);

let high=scores.filter(s=>s>=75).length;
let mid=scores.filter(s=>s>=50&&s<75).length;
let low=scores.filter(s=>s<50).length;

document.getElementById("dash").innerHTML=`
<p>Total: ${total}</p>
<p>Avg AI Score: ${avg}</p>
<p class="high">High Success: ${high}</p>
<p class="mid">Medium: ${mid}</p>
<p class="low">Risk/RTS: ${low}</p>
`;
}

/* =========================
   RENDER TABLE
========================= */
function render(){

list.innerHTML=cache.map(t=>{

let score=aiScore(t);

return `
<tr>

<td>${t.name}</td>

<td>
<select onchange="update(${t.id},'status',this.value)">
<option ${t.status==="PENDING"?"selected":""}>PENDING</option>
<option ${t.status==="SUCCESS"?"selected":""}>SUCCESS</option>
<option ${t.status==="RTS"?"selected":""}>RTS</option>
</select>
</td>

<td>
<select onchange="update(${t.id},'route',this.value)">
<option>Club Route</option>
<option>Agency Route</option>
<option>Event Route</option>
<option>Foundation Route</option>
<option>General</option>
</select>
</td>

<td><b>${score}</b></td>

<td>
<span class="badge ${color(score)}">${label(score)}</span>
</td>

</tr>
`;

}).join("");
}

/* =========================
   EXPORT
========================= */
function exportData(){
let blob=new Blob([JSON.stringify(cache,null,2)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="VaultOS_AI_V2.json";
a.click();
}

/* INIT */
initDB();

</script>

</body>
</html>
