


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VaultOS SR20 Engine</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
margin:0;font-family:Arial;background:#020617;color:#fff;display:flex;min-height:100vh;
}
aside{
width:260px;background:#01040d;padding:15px;border-right:1px solid #334155;
}
main{flex:1;padding:15px}

.card{
background:#0f172a;padding:15px;border-radius:10px;margin-bottom:15px;
}

input,select,button{
width:100%;padding:8px;margin-top:6px;
background:#1e293b;color:#fff;border:1px solid #334155;border-radius:6px;
}

table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #334155;padding:8px}

.hidden{display:none}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#1e293b;padding:10px;border-radius:8px;text-align:center}
.stat b{display:block;color:#38bdf8;font-size:20px}
.small{opacity:0.7;font-size:12px}
</style>
</head>

<body>

<aside>
<h2>VaultOS SR20</h2>

<button onclick="show('dash')">Dashboard</button>
<button onclick="show('data')">Database</button>

<input type="file" id="importFile">
<button onclick="exportJSON()">Export</button>
</aside>

<main>

<!-- DASH -->
<div id="dash">
<div class="card">
<h3>Analytics Engine</h3>

<div class="grid">
<div class="stat">Total<b id="t">0</b></div>
<div class="stat">Success<b id="s">0</b></div>
<div class="stat">Pending<b id="p">0</b></div>
<div class="stat">RTS<b id="r">0</b></div>
</div>

<div class="card">
<h3>Route Intelligence</h3>
<div id="routes"></div>
</div>
</div>
</div>

<!-- DATA -->
<div id="data" class="hidden">

<div class="card">
<h3>Add Record</h3>

<input id="name" placeholder="Name">

<select id="status">
<option>PENDING</option>
<option>SENT</option>
<option>SUCCESS</option>
<option>RTS</option>
</select>

<select id="route">
<option>Club Route</option>
<option>Agency Route</option>
<option>Event Route</option>
<option>Foundation Route</option>
<option>General Route</option>
</select>

<select id="method">
<option>TTM</option>
<option>IP</option>
<option>EVENT</option>
</select>

<button onclick="DB.add()">Add</button>
</div>

<div class="card">
<input id="search" placeholder="Search..." oninput="render()">

<table>
<tbody id="table"></tbody>
</table>
</div>

</div>

</main>

<script>

/* =========================
   DATABASE ENGINE (SR20 CORE)
========================= */
let vault = JSON.parse(localStorage.getItem("VAULT_SR20")) || {
targets:[]
};

const DB = {

save(){
localStorage.setItem("VAULT_SR20", JSON.stringify(vault));
},

normalizeStatus(s){
return (s||"PENDING").toString().trim().toUpperCase();
},

normalize(t){
return {
id:Date.now()+Math.random(),
name:t.name || t.Name || "Unknown",
status:this.normalizeStatus(t.status || t.Status),
route:t.route || "General Route",
method:t.method || "TTM"
};
},

add(){
if(!name.value.trim()) return;

vault.targets.push(this.normalize({
name:name.value,
status:status.value,
route:route.value,
method:method.value
}));

this.save();
render();
},

update(){
this.save();
render();
},

remove(id){
vault.targets = vault.targets.filter(x=>x.id!==id);
this.save();
render();
}

};

/* =========================
   NAV
========================= */
function show(id){
dash.classList.add("hidden");
data.classList.add("hidden");
$(id).classList.remove("hidden");
}

const $ = id=>document.getElementById(id);

/* =========================
   DASHBOARD ENGINE
========================= */
function updateDash(){

let t = vault.targets;

let total = t.length;
let success = t.filter(x=>x.status==="SUCCESS").length;
let pending = t.filter(x=>x.status==="PENDING").length;
let rts = t.filter(x=>x.status.includes("RTS")).length;

t.text = t;

tEl.textContent = total;
sEl.textContent = success;
pEl.textContent = pending;
rEl.textContent = rts;

/* route intelligence */
let routes = {};

t.forEach(x=>{
if(!routes[x.route]) routes[x.route]={t:0,s:0};
routes[x.route].t++;
if(x.status==="SUCCESS") routes[x.route].s++;
});

let html="";
Object.entries(routes).forEach(([k,v])=>{
let pct = v.t ? ((v.s/v.t)*100).toFixed(1) : 0;
html+=`
<div class="small">
<b>${k}</b> → ${pct}% success (${v.s}/${v.t})
</div>`;
});

routesEl.innerHTML = html;
}

/* =========================
   TABLE RENDER
========================= */
function render(){

let q = (search.value||"").toLowerCase();

table.innerHTML = vault.targets
.filter(x=>JSON.stringify(x).toLowerCase().includes(q))
.map((t,i)=>`

<tr>

<td>
<input value="${t.name}"
oninput="vault.targets[${i}].name=this.value; DB.update()">
</td>

<td>${t.status}</td>
<td>${t.route}</td>
<td>${t.method}</td>

<td>
<button onclick="DB.remove('${t.id}')">X</button>
</td>

</tr>

`).join("");

updateDash();
}

/* =========================
   IMPORT FIX (SR20 SAFE)
========================= */
importFile.onchange = e=>{

let f=e.target.files[0];
let r=new FileReader();

r.onload=()=>{

try{

let d=JSON.parse(r.result||"{}");

let raw =
d.records || d.targets || d.data || [];

vault.targets = raw.map(x=>DB.normalize(x));

DB.save();
render();

alert("Imported: "+vault.targets.length);

}catch(err){
alert("Import failed: "+err.message);
}

};

r.readAsText(f);
};

/* =========================
   EXPORT
========================= */
function exportJSON(){
let blob=new Blob([JSON.stringify(vault,null,2)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="VaultSR20.json";
a.click();
}

/* INIT */
render();

</script>

</body>
</html>
